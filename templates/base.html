<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="{{root}}assets/leaf.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="sky">
  <div class="clouds" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
  </div>
  <div class="sky-inner">
    <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false">☰</button>
    <a class="sign" href="{{root}}index.html">
      <span class="sign-board">
        <span class="sign-leaf" aria-hidden="true"><img src="{{root}}assets/leaf.svg" alt=""></span>
        <span class="sign-text">{{site_name}}</span>
      </span>
      <span class="sign-post l" aria-hidden="true"></span><span class="sign-post r" aria-hidden="true"></span>
    </a>
    <form class="search" role="search" id="searchForm" autocomplete="off">
      <input type="search" id="searchInput" placeholder="문서 검색…  (예: 세이브, 날씨, func_02040c90)" aria-label="검색">
      <button type="submit" aria-label="검색">🔍</button>
      <div class="search-results" id="searchResults" hidden></div>
    </form>
  </div>
  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 1200 90" preserveAspectRatio="none"><path d="M0,70 C150,10 300,10 450,60 C600,110 750,20 900,45 C1050,70 1150,30 1200,50 L1200,90 L0,90 Z" fill="#79c142"/><path d="M0,90 C200,40 400,80 600,60 C800,40 1000,85 1200,65 L1200,90 Z" fill="#5faa2f"/></svg>
  </div>
</header>
<div class="grass" aria-hidden="true"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="pocket">
      <div class="pocket-title">🎒 주머니</div>
      <nav class="nav" aria-label="문서 목록">
      {{nav}}
      </nav>
      <div class="pocket-foot">
        <label class="toggle"><input type="checkbox" id="citeToggle"> <span>출처 펼쳐 보기</span></label>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="bubble">
    {{content}}
    </div>
    <footer class="foot">
      <p>원문의 근거 등급(S 소스 · E 실험 · O 오라클 · H 가설 · P 공개 기록 · M 측정)과 출처를 함께 읽어 주세요. 원문이 기록 문서이며, 이 사이트는 그것을 한글로 옮긴 팬 위키입니다.</p>
      <p>비공식 팬 프로젝트. 「놀러오세요 동물의 숲」은 Nintendo의 상표다. 디컴파일 소스·ROM 문자열·에셋은 싣지 않는다.</p>
    </footer>
  </main>

  <aside class="tocbar">{{toc}}</aside>
</div>
<div class="backdrop" id="backdrop"></div>

<script>window.ACWW_ROOT = "{{root}}";</script>
<script src="{{root}}assets/site.js" defer></script>
</body>
</html>
